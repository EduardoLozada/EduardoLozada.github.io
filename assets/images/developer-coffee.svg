<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background:transparent">
  <style>
    .smoke { animation: float 3s infinite ease-in-out; opacity: 0.6; }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-10px) scale(1.1); opacity: 0.3; }
    }
    .smoke-2 { animation-delay: 0.4s; }
    .smoke-3 { animation-delay: 0.8s; }
  </style>
  
  <!-- Humo animado -->
  <path class="smoke" fill="#6B7280" d="M210,80 Q215,70 220,80 T230,80 T240,80 T250,80" />
  <path class="smoke smoke-2" fill="#6B7280" d="M205,70 Q210,60 215,70 T225,70 T235,70 T245,70" />
  <path class="smoke smoke-3" fill="#6B7280" d="M215,60 Q220,50 225,60 T235,60 T245,60 T255,60" />
  
  <!-- Desarrollador -->
  <path fill="#4B5563" d="M180,100 Q190,90 200,100 Q220,120 220,150 L180,150 Q180,120 180,100" />
  <circle fill="#4B5563" cx="200" cy="85" r="20" />
  
  <!-- Laptop -->
  <rect fill="#374151" x="140" y="160" width="120" height="80" rx="5" />
  <rect fill="#1F2937" x="150" y="170" width="100" height="60" />
  
  <!-- Taza de café -->
  <path fill="#DC2626" d="M240,120 L260,120 L255,150 L245,150 Z" />
  <ellipse fill="#DC2626" cx="250" cy="120" rx="10" ry="5" />
  <ellipse fill="#92400E" cx="250" cy="125" rx="8" ry="3" />
</svg>