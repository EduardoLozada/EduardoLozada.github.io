      (function() {
        
        
        // Protección básica para String.prototype.match
        const originalMatch = String.prototype.match;
        String.prototype.match = function() {
          try {
            if (this === undefined || this === null) {
              return null;
            }
            return originalMatch.apply(this, arguments);
          } catch (e) {
            return null;
          }
        };
        
        // Monitoreo de errores
        window.onerror = function(message, source, lineno, colno, error) {
          // Loguear el error para diagnóstico

          // Continuar ejecución normal

        };

        // Se inicializará automáticamente en elementos con atributo data-tilt

          if (tiltElements && tiltElements.length > 0) {
            if (typeof VanillaTilt !== 'undefined') {
              VanillaTilt.init(tiltElements, {
                max: 10,
                speed: 400,
                glare: true,
                'max-glare': 0.1,
