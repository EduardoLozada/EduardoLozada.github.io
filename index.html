    <style>
      /* Reset y variables básicas */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      
      :root {
        --primary: #6366f1;
        --bg: #ffffff;
        --text: #0f172a;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      
      body.dark-theme {
        --bg: #0f172a;
        --text: #f8fafc;
        background: var(--bg);
        color: var(--text);
      }
      
      /* Placeholder de carga */
      .loading-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e2e8f0;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Iconos - Placeholder mientras cargan */
      [class^="ion-"], [class*=" ion-"] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1em;
        min-height: 1em;
      }
    </style>
